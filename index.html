
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBULA — Adaptive Browser</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0e14;color:#eef2ff;overflow:hidden}
button,input{font:inherit}button{cursor:pointer;color:inherit}.app{height:100vh;display:flex;flex-direction:column}
.bar{height:62px;background:#111620;border-bottom:1px solid #252c3b;display:flex;align-items:center;gap:8px;padding:8px 12px}
.logo{font-weight:900;font-size:20px;letter-spacing:2px;padding:0 10px}.logo i{font-style:normal}
.icon{width:40px;height:40px;border:0;border-radius:12px;background:#1b2230}.icon:hover{background:#273044}
.address{height:42px;flex:1;border:1px solid #30394c;border-radius:22px;background:#171d29;color:#fff;padding:0 18px;outline:0}.address:focus{border-color:#667cff}
.tabs{height:38px;background:#0e121a;display:flex;align-items:end;padding:0 10px;gap:5px;border-bottom:1px solid #252c3b}.tab{height:34px;min-width:150px;max-width:210px;padding:0 12px;border-radius:10px 10px 0 0;background:#171d29;border:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tab.active{background:#20283a}.close{float:right}
.main{flex:1;overflow:auto}.home{min-height:100%;padding:35px max(18px,5vw);background:radial-gradient(circle at 50% 10%,#26366c 0,#101729 32%,#0b0e14 65%)}
.hero{text-align:center;padding:30px 0}.hero h1{font-size:clamp(42px,8vw,82px);margin:0;letter-spacing:-5px}.hero p{color:#aab4cc}.search{margin:20px auto;width:min(760px,100%);height:58px;border-radius:30px;background:#151c2b;border:1px solid #35415c;display:flex;align-items:center;padding:0 20px}.search input{flex:1;background:none;border:0;outline:0;color:white;font-size:17px}.search button{border:0;background:#6576ff;border-radius:22px;padding:9px 18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1050px;margin:auto}.card{background:#141a26;border:1px solid #252f43;border-radius:18px;padding:18px;min-height:130px;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#596bff}.orb{font-size:28px}.card b{display:block;margin-top:12px}.card small{color:#8995ae}
.page{display:none;padding:30px;min-height:100%;background:#0f1420}.page h2{font-size:30px}.result{padding:16px;border-bottom:1px solid #273044}.result b{font-size:18px}.result small{display:block;color:#8792aa;margin-top:5px}
.bottom{height:42px;background:#111620;border-top:1px solid #252c3b;display:flex;align-items:center;justify-content:center;gap:20px;color:#8e99b1;font-size:12px}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);background:#eef2ff;color:#111827;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.logo{font-size:16px;padding:0 3px}.tabs{overflow:auto}.tab{min-width:135px}.cards{grid-template-columns:1fr 1fr}.bar .icon:nth-child(2){display:none}.home{padding:20px 12px}.hero h1{letter-spacing:-3px}}
</style>
</head>
<body>
<div class="app">
<header class="bar">
<button class="icon" onclick="back()">←</button><button class="icon" onclick="forward()">→</button><button class="icon" onclick="reload()">↻</button>
<div class="logo">✦ NEBULA</div>
<input id="address" class="address" value="nebula://home" onkeydown="addressKey(event)">
<button class="icon" onclick="toggleStar()">☆</button><button class="icon" onclick="newTab()">＋</button>
</header>
<div class="tabs" id="tabs"></div>
<main class="main" id="main">
<section class="home" id="home">
<div class="hero"><h1>NEBULA</h1><p>A browser that turns the new tab into a launchpad.</p>
<div class="search"><span>⌕</span><input id="q" placeholder="Search the web or enter a URL" onkeydown="searchKey(event)"><button onclick="search()">GO</button></div></div>
<div class="cards">
<button class="card" onclick="openSite('YouTube','https://www.youtube.com')"><div class="orb">▶</div><b>YouTube</b><small>Watch & discover</small></button>
<button class="card" onclick="openSite('GitHub','https://github.com')"><div class="orb">⌘</div><b>GitHub</b><small>Build & collaborate</small></button>
<button class="card" onclick="openSite('ChatGPT','https://chatgpt.com')"><div class="orb">✦</div><b>ChatGPT</b><small>Think with AI</small></button>
<button class="card" onclick="openSite('Wikipedia','https://www.wikipedia.org')"><div class="orb">W</div><b>Wikipedia</b><small>Explore knowledge</small></button>
</div></section>
<section class="page" id="page"><h2 id="pageTitle"></h2><div id="results"></div></section>
</main>
<footer class="bottom">NEBULA • Local prototype • <span id="status">Ready</span></footer>
</div>
<div class="toast" id="toast"></div>
<script>
let tabs=[{name:"New Tab",url:"nebula://home"}],active=0,history=[],hi=-1;
const $=x=>document.getElementById(x);
function renderTabs(){let t=$("tabs");t.innerHTML="";tabs.forEach((x,i)=>{let b=document.createElement("button");b.className="tab "+(i===active?"active":"");b.innerHTML="✦ "+x.name+" <span class='close' onclick='closeTab(event,"+i+")'>×</span>";b.onclick=()=>{active=i;load(tabs[i].url,false)};t.appendChild(b)});$("address").value=tabs[active].url}
function load(url,save=true){tabs[active].url=url;$("home").style.display=url==="nebula://home"?"block":"none";$("page").style.display=url==="nebula://home"?"none":"block";if(url!=="nebula://home"){$("pageTitle").textContent=tabs[active].name;$("results").innerHTML="<div class='result'><b>NEBULA preview</b><small>"+escapeHtml(url)+"</small></div><div class='result'>This single-file browser keeps the interface lightweight. The site can be opened in your normal browser with the button below.</div><button class='card' style='margin-top:18px' onclick='external()'>🌐 Open this address externally</button>"}$("address").value=url;renderTabs();if(save){history=history.slice(0,hi+1);history.push(url);hi++}}
function newTab(){tabs.push({name:"New Tab",url:"nebula://home"});active=tabs.length-1;load("nebula://home",false)}
function closeTab(e,i){e.stopPropagation();if(tabs.length===1)return;tabs.splice(i,1);active=Math.min(active,tabs.length-1);load(tabs[active].url,false)}
function search(){let q=$("q").value.trim();if(!q)return;let url=q.includes("://")?q:"https://www.google.com/search?q="+encodeURIComponent(q);tabs[active].name=q.slice(0,20)||"Search";load(url)}
function searchKey(e){if(e.key==="Enter")search()}
function addressKey(e){if(e.key==="Enter"){let v=$("address").value.trim();if(!v)return;let u=v.includes("://")?v:"https://"+v;tabs[active].name=v.replace(/^https?:\/\//,"").slice(0,20);load(u)}}
function openSite(name,url){tabs[active].name=name;load(url)}
function external(){window.open(tabs[active].url,"_blank","noopener")}
function back(){if(hi>0){hi--;load(history[hi],false)}}
function forward(){if(hi<history.length-1){hi++;load(history[hi],false)}}
function reload(){let u=tabs[active].url;load(u,false);toast("Reloaded")}
function toggleStar(){toast("Saved to Nebula favorites")}
function toast(x){$("toast").textContent=x;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1400)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
renderTabs();history=["nebula://home"];hi=0;
</script>
</body>
</html>
